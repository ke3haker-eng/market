<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A"><title>كاشير الدكان</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4F46E5;--pb:rgba(79,70,229,.12);--ok:#10B981;--bad:#EF4444;--bg:#F6F7FB;--cd:#fff;--in:#EEF1F6;--t:#1E293B;--t2:#64748B;--b:#E5E9F0;--sh:0 2px 10px rgba(15,23,42,.06)}
[data-theme=dark]{--bg:#0F172A;--cd:#1E293B;--in:#2B3850;--t:#F1F5F9;--t2:#94A3B8;--b:#2B3850;--sh:0 2px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 8px}
h1{font-size:1.6rem;font-weight:800}header p{color:var(--t2);font-size:.9rem;min-height:1.2em}
main{padding:10px 16px 210px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--b);background:var(--in);color:var(--t);font:inherit;font-size:1rem;outline:0}
input:focus{border-color:var(--p)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;border:0;cursor:pointer;border-radius:14px;padding:12px 16px;background:var(--in);color:var(--t)}
button:active{transform:scale(.96)}
.pr{background:var(--p);color:#fff;font-weight:700}.dn{background:var(--bad);color:#fff}.ib{width:50px;padding:0;flex:none}
.bar{display:flex;gap:8px;margin-bottom:14px}.sb{position:relative;flex:1}.sb .ic{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--t2)}.sb input{padding-right:44px}
.cd{background:var(--cd);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.cd.col{flex-direction:column;align-items:stretch;gap:2px;padding:6px 14px}
.i{flex:1;min-width:0}.i b,.i small{display:block;overflow:hidden;text-overflow:ellipsis}small{color:var(--t2);font-size:.78rem}
.av{width:42px;height:42px;border-radius:50%;background:var(--pb);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ln{flex-wrap:wrap}.ln .r2{width:100%;display:flex;align-items:center;justify-content:space-between}
.q{display:flex;align-items:center;gap:12px;background:var(--in);border-radius:99px;padding:3px}.q button{width:34px;height:34px;padding:0;border-radius:50%;background:var(--cd)}
.lt{font-size:1.1rem;color:var(--p)}.gh{background:none;padding:6px;color:var(--t2)}
.em{text-align:center;color:var(--t2);padding:50px 10px;line-height:2}.em .ic{opacity:.5}
.sm{display:flex;gap:10px;margin-bottom:14px}.sm>div{flex:1;background:var(--p);color:#fff;border-radius:18px;padding:14px}.sm small{color:#fffb}.sm b{font-size:1.4rem}
.dh{display:flex;justify-content:space-between;margin:16px 4px 8px;color:var(--t2);font-size:.9rem}.dh span{color:var(--ok);font-weight:700}
.ib2{width:42px;height:42px;border-radius:50%;background:rgba(16,185,129,.15);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.sec{margin:18px 4px 8px;color:var(--t2);font-size:.85rem;font-weight:700}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}.rw:last-child{border:0}
.rw small{display:block}.rw.big{font-size:1.2rem;font-weight:800;border:0}.rw.big b{color:var(--ok)}
.mini{width:140px;padding:8px 10px;text-align:center}
.row{background:none;justify-content:flex-start;padding:13px 0;border-radius:0;border-bottom:1px solid var(--b);width:100%}.row:last-child{border:0}.red{color:var(--bad)}
.seg{display:flex;background:var(--in);border-radius:14px;padding:4px;margin:6px 0}.seg button{flex:1;background:none;padding:10px}.seg .on{background:var(--cd);color:var(--p);font-weight:700;box-shadow:var(--sh)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;z-index:1}.sw i{position:absolute;inset:0;background:var(--in);border-radius:99px;transition:.2s}.sw i:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{right:23px}
#fabs{position:fixed;inset:auto 0 calc(84px + env(safe-area-inset-bottom)) 0;z-index:4;pointer-events:none}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;padding:0;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.fab.cam{position:absolute;right:18px;bottom:0;background:var(--p)}
.fl{position:absolute;left:18px;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.fl .fab{background:var(--ok)}
.pill{pointer-events:auto;background:var(--cd);border:1px solid var(--b);border-radius:18px;padding:8px 16px;box-shadow:0 8px 22px rgba(0,0,0,.18);display:flex;flex-direction:column}.pill small{font-size:.72rem}.pill b{font-size:1.35rem;color:var(--ok);line-height:1.3}
nav{position:fixed;inset:auto 0 0 0;z-index:6;display:flex;gap:4px;background:var(--cd);border-top:1px solid var(--b);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;flex-direction:column;gap:3px;font-size:.72rem;background:none;color:var(--t2);padding:8px 0}nav .on{color:var(--p);background:var(--pb);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:10}
.md{background:var(--cd);width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;max-height:90vh;overflow:auto}
#cam{position:fixed;inset:0;background:#000;z-index:11}#cam video{width:100%;height:100%;object-fit:cover}
.fr{position:absolute;inset:30% 10%;border:3px solid #fff8;border-radius:20px}.x{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px}.ht{position:absolute;bottom:12%;width:100%;text-align:center;color:#fff}
#ts{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;max-width:90%}
</style></head><body>
<header><h1 id="h1"></h1><p id="h2"></p></header><main id="app"></main><div id="fabs"></div><nav id="nav"></nav>
<script>
const I={cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/>',
cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',minus:'<line x1="5" y1="12" x2="19" y2="12"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',check:'<polyline points="20 6 9 17 4 12"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const ic=(n,s=20)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>';
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let P=L('sh_p',[]),C=L('sh_c',[]),H=L('sh_s',[]),T={name:'',cur:'',theme:'auto',vib:1,snd:1,once:0,...L('sh_t',{})},tab='sell',last='',lt=0,stream,tm,zx,onScan,paused=false;
const save=()=>[['sh_p',P],['sh_c',C],['sh_s',H],['sh_t',T]].forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}),mc=n=>m(n)+(T.cur?' '+esc(T.cur):'');
const prod=id=>P.find(p=>p.id===id),tot=l=>{const p=prod(l.id);return p?(p.u=='kg'?p.price*l.g/1000:p.price*l.qty):0},sum=()=>C.reduce((s,l)=>s+tot(l),0);
const av=n=>'<div class="av">'+esc(n.trim().charAt(0)||'?')+'</div>',dk=t=>new Date(t).toLocaleDateString('en-CA');
const tf=t=>new Date(t).toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'}),df=t=>new Date(t).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
const mq=matchMedia('(prefers-color-scheme:dark)');
function theme(){const d=T.theme=='auto'?mq.matches:T.theme=='dark';document.documentElement.dataset.theme=d?'dark':'light';$('meta[name=theme-color]').content=d?'#0F172A':'#F6F7FB'}mq.onchange=theme;
function toast(t){const d=document.createElement('div');d.id='ts';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='mo';o.innerHTML='<div class="md">'+h+'</div>';o.onclick=e=>{if(e.target===o)closeM()};document.body.append(o)}
const closeM=()=>$('#mo')?.remove();
function beep(){if(!T.snd)return;try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},90)}catch{}}
const fb=()=>{if(T.vib)navigator.vibrate?.(60);beep()};
const rows=a=>a.map(i=>'<div class="rw"><span>'+esc(i.name)+'<small>'+esc(i.d)+'</small></span><b>'+mc(i.total)+'</b></div>').join('');
const snap=()=>C.map(l=>{const p=prod(l.id);return{name:p.name,d:p.u=='kg'?l.g+' جم × '+m(p.price)+' /كجم':l.qty+' × '+m(p.price),total:tot(l)}});
const empty=(i,t)=>'<div class="em">'+ic(i,44)+'<br>'+t+'</div>';
function sell(){
  const lines=C.map(l=>{const p=prod(l.id),k=p.u=='kg';return '<div class="cd ln">'+av(p.name)+'<div class="i"><b>'+esc(p.name)+'</b><small>'+(k?l.g+' جم × '+mc(p.price)+' /كجم':mc(p.price)+' للقطعة')+'</small></div><button class="gh" data-a="rm" data-id="'+p.id+'">'+ic('x',18)+'</button><div class="r2">'+
   (k?'<button data-a="wt" data-id="'+p.id+'">'+ic('edit',16)+' تعديل الوزن</button>':'<div class="q"><button data-a="pl" data-id="'+p.id+'">'+ic('plus',16)+'</button><b>'+l.qty+'</b><button data-a="mi" data-id="'+p.id+'">'+ic('minus',16)+'</button></div>')+'<b class="lt">'+mc(tot(l))+'</b></div></div>'}).join('');
  return '<div class="sb"><input id="code" placeholder="ابحث بالاسم أو اكتب الباركود" enterkeyhint="search" autocomplete="off">'+ic('search',20)+'</div><div id="sug" style="margin-top:10px"></div>'+(lines||empty('cart','القائمة فارغة<br>امسح باركود بالكاميرا أو ابحث بالاسم'))}
function hist(){
  const td=H.filter(s=>dk(s.t)==dk(Date.now())),days={};
  H.slice().reverse().forEach(s=>(days[dk(s.t)]=days[dk(s.t)]||[]).push(s));
  return '<div class="sm"><div><small>مبيعات اليوم</small><b>'+mc(td.reduce((a,s)=>a+s.total,0))+'</b></div><div><small>عمليات اليوم</small><b>'+td.length+'</b></div></div>'+
  (H.length?Object.values(days).map(a=>'<div class="dh"><b>'+df(a[0].t)+'</b><span>'+mc(a.reduce((x,s)=>x+s.total,0))+'</span></div>'+a.map(s=>'<div class="cd" data-a="sale" data-id="'+s.id+'"><div class="ib2">'+ic('check',20)+'</div><div class="i"><b>'+s.items.length+' أصناف</b><small>'+tf(s.t)+'</small></div><b>'+mc(s.total)+'</b></div>').join('')).join(''):empty('clock','لا توجد عمليات منتهية بعد'))}
function sets(){
  const sw=(k,l)=>'<div class="rw"><span>'+l+'</span><label class="sw"><input type="checkbox" data-k="'+k+'"'+(T[k]?' checked':'')+'><i></i></label></div>',
  tx=(k,l,ph)=>'<div class="rw"><span>'+l+'</span><input class="mini" data-k="'+k+'" value="'+esc(T[k])+'" placeholder="'+ph+'"></div>',
  bt=(a,i,l,c)=>'<button class="row '+(c||'')+'" data-a="'+a+'">'+ic(i)+'<span>'+l+'</span></button>';
  return '<div class="sec">المتجر</div><div class="cd col">'+tx('name','اسم المتجر','اختياري')+tx('cur','العملة','مثال: ر.س')+'</div>'+
  '<div class="sec">المظهر</div><div class="cd col"><div class="seg">'+[['auto','تلقائي'],['light','نهاري'],['dark','ليلي']].map(([v,l])=>'<button data-a="th" data-v="'+v+'" class="'+(T.theme==v?'on':'')+'">'+l+'</button>').join('')+'</div></div>'+
  '<div class="sec">المسح والتنبيهات</div><div class="cd col">'+sw('vib','الاهتزاز عند المسح')+sw('snd','صوت عند المسح')+sw('once','إغلاق الكاميرا بعد كل مسح')+'</div>'+
  '<div class="sec">البيانات</div><div class="cd col">'+bt('exp','down','تصدير نسخة احتياطية')+bt('imp','up','استيراد نسخة احتياطية')+bt('clh','trash','حذف سجل المشتريات','red')+bt('rst','trash','حذف كل البيانات','red')+'</div><div class="em">كاشير الدكان — الإصدار 2</div>'}
function render(){
  C=C.filter(l=>prod(l.id));
  const N=[['sell','cart','البيع'],['prod','box','المنتجات'],['hist','clock','السجل'],['set','gear','الإعدادات']];
  $('#nav').innerHTML=N.map(([k,i,t])=>'<button data-a="tab" data-t="'+k+'" class="'+(tab==k?'on':'')+'">'+ic(i,22)+'<span>'+t+'</span></button>').join('');
  $('#h1').textContent={sell:'قائمة المشتريات',prod:'المنتجات',hist:'سجل المشتريات',set:'الإعدادات'}[tab];
  $('#h2').textContent={sell:T.name,prod:P.length+' منتج مسجّل',hist:H.length+' عملية منتهية',set:'تخصيص التطبيق'}[tab];
  $('#fabs').innerHTML=tab=='sell'?'<button class="fab cam" data-a="cam">'+ic('cam',26)+'</button>'+(C.length?'<div class="fl"><div class="pill"><small>الإجمالي · '+C.length+' صنف</small><b>'+mc(sum())+'</b></div><button class="fab" data-a="fin">'+ic('check',28)+'</button></div>':''):'';
  if(tab=='sell'){
    $('#app').innerHTML=sell();const c=$('#code');
    c.oninput=()=>{const v=c.value.trim().toLowerCase();$('#sug').innerHTML=v?P.filter(p=>p.name.toLowerCase().includes(v)||(p.bc||'').includes(v)).slice(0,5).map(p=>'<div class="cd" data-a="pick" data-id="'+p.id+'">'+av(p.name)+'<div class="i"><b>'+esc(p.name)+'</b></div><b>'+mc(p.price)+(p.u=='kg'?' /كجم':'')+'</b></div>').join(''):''};
    c.onkeydown=e=>{if(e.key!='Enter')return;const v=c.value.trim();if(!v)return;const f=P.filter(x=>x.name.includes(v)),p=P.find(x=>x.bc===v)||(f.length==1&&f[0]);
      if(p){add(p);c.value='';c.oninput()}else if(/^\d+$/.test(v)){toast('غير مسجّل — أضفه الآن');form(null,v)}else toast('لا يوجد منتج بهذا الاسم')};
  }else if(tab=='prod'){
    $('#app').innerHTML='<div class="bar"><div class="sb"><input id="sq" placeholder="بحث في المنتجات">'+ic('search',20)+'</div><button class="pr ib" data-a="new">'+ic('plus',22)+'</button></div><div id="pl"></div>';
    const draw=()=>{const v=$('#sq').value.trim().toLowerCase(),r=P.filter(p=>!v||p.name.toLowerCase().includes(v)||(p.bc||'').includes(v));
      $('#pl').innerHTML=r.length?r.map(p=>'<div class="cd" data-a="edit" data-id="'+p.id+'">'+av(p.name)+'<div class="i"><b>'+esc(p.name)+'</b><small>'+esc(p.bc||'بدون باركود')+(p.u=='kg'?' · بالكيلو':'')+'</small></div><b class="lt">'+mc(p.price)+'</b></div>').join(''):empty('box','لا توجد منتجات')};
    $('#sq').oninput=draw;draw();
  }else $('#app').innerHTML=tab=='hist'?hist():sets();
}
function add(p){
  if(p.u=='kg')return askW(p,false);
  const l=C.find(x=>x.id==p.id);l?l.qty++:C.push({id:p.id,qty:1});save();render();fb();toast('أُضيف: '+p.name)
}
function askW(p,rep){
  const l=C.find(x=>x.id==p.id);
  modal('<b>'+esc(p.name)+' — '+mc(p.price)+' / كجم</b><input id="g" type="number" inputmode="decimal" placeholder="الوزن بالجرام" value="'+(rep&&l?l.g:'')+'"><div id="gp" style="font-size:1.5rem;font-weight:800;color:var(--ok)">0</div><button class="pr" id="gok">'+ic('check',18)+' تأكيد</button>');
  const g=$('#g');g.oninput=()=>$('#gp').textContent=mc(p.price*(+g.value||0)/1000);g.oninput();setTimeout(()=>g.focus(),50);
  $('#gok').onclick=()=>{const w=+g.value;if(!(w>0))return toast('أدخل الوزن');l?(l.g=rep?w:l.g+w):C.push({id:p.id,g:w});save();closeM();render();fb();if(T.once&&!rep)closeCam();paused=false};
  const o=$('#mo');o.style.zIndex=12;o.onclick=e=>{if(e.target===o){closeM();paused=false}}
}
function form(id,bc){
  const p=id?prod(id):{bc:bc||'',name:'',price:'',u:'pc'};
  modal('<b>'+(id?'تعديل منتج':'منتج جديد')+'</b><div class="bar" style="margin:0"><input id="fb" placeholder="الباركود" value="'+esc(p.bc||'')+'"><button class="ib" data-a="scf">'+ic('cam',22)+'</button></div><input id="fn" placeholder="اسم المنتج" value="'+esc(p.name)+'"><input id="fp" type="number" inputmode="decimal" placeholder="السعر" value="'+p.price+'"><select id="fu"><option value="pc">يُباع بالقطعة</option><option value="kg"'+(p.u=='kg'?' selected':'')+'>يُباع بالكيلو (السعر لكل كجم)</option></select><button class="pr" id="fs">حفظ</button>'+(id?'<button class="dn" id="fd">حذف المنتج</button>':''));
  $('#fs').onclick=()=>{const bc=$('#fb').value.trim(),name=$('#fn').value.trim(),price=+$('#fp').value;
    if(!name||$('#fp').value===''||!(price>=0))return toast('أدخل الاسم والسعر');
    if(bc&&P.some(x=>x.bc===bc&&x.id!=id))return toast('هذا الباركود مسجّل لمنتج آخر');
    const d={bc,name,price,u:$('#fu').value};id?Object.assign(p,d):P.push({id:Date.now().toString(36),...d});save();closeM();render()};
  if(id)$('#fd').onclick=()=>{if(confirm('حذف هذا المنتج؟')){P=P.filter(x=>x.id!=id);save();closeM();render()}}
}
const loadZX=()=>new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=r;s.onerror=j;document.head.append(s)});
function hit(code){if(paused||(code==last&&Date.now()-lt<1800))return;last=code;lt=Date.now();onScan(code)}
async function openCam(cb){
  onScan=cb;const o=document.createElement('div');o.id='cam';o.innerHTML='<video id="v" playsinline muted></video><div class="fr"></div><button class="x dn" data-a="camx">'+ic('x',18)+' إغلاق</button><div class="ht">وجّه الباركود نحو الكاميرا</div>';document.body.append(o);
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector(),v=$('#v');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();
      const tick=async()=>{if(!stream)return;try{const r=await det.detect(v);if(r[0])hit(r[0].rawValue)}catch{}tm=setTimeout(tick,200)};tick();
    }else{await loadZX();zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoDevice(undefined,'v',r=>{if(r)hit(r.getText())})}
  }catch(e){closeCam();toast('تعذّر فتح الكاميرا — اسمح بالإذن وافتح التطبيق عبر HTTPS')}
}
function closeCam(){clearTimeout(tm);stream?.getTracks().forEach(t=>t.stop());stream=null;try{zx?.reset()}catch{}zx=null;$('#cam')?.remove();paused=false}
const sellScan=code=>{const p=P.find(x=>x.bc===code);if(!p)return toast('غير مسجّل: '+code);if(p.u=='kg')paused=true;add(p);if(T.once&&p.u!='kg')closeCam()};
const A={
  tab:(_,b)=>{tab=b.dataset.t;render();scrollTo(0,0)},cam:()=>openCam(sellScan),camx:closeCam,
  pick:id=>{add(prod(id));$('#code').value='';$('#sug').innerHTML=''},
  pl:id=>{C.find(l=>l.id==id).qty++;save();render()},
  mi:id=>{const l=C.find(l=>l.id==id);if(--l.qty<1)C=C.filter(x=>x!==l);save();render()},
  rm:id=>{C=C.filter(l=>l.id!=id);save();render()},wt:id=>askW(prod(id),true),
  fin:()=>modal('<b>إنهاء الشراء</b>'+rows(snap())+'<div class="rw big"><span>الإجمالي</span><b>'+mc(sum())+'</b></div><button class="pr" data-a="ok">'+ic('check',18)+' تأكيد وإنهاء</button>'),
  ok:()=>{H.push({id:Date.now().toString(36),t:new Date().toISOString(),items:snap(),total:sum()});C=[];save();closeM();render();toast('تم حفظ العملية في السجل')},
  new:()=>form(),edit:id=>form(id),scf:()=>openCam(code=>{$('#fb').value=code;closeCam();fb()}),
  sale:id=>{const s=H.find(x=>x.id==id);s&&modal('<b>'+df(s.t)+' — '+tf(s.t)+'</b>'+rows(s.items)+'<div class="rw big"><span>الإجمالي</span><b>'+mc(s.total)+'</b></div><button class="dn" data-a="dsale" data-id="'+id+'">'+ic('trash',18)+' حذف العملية</button>')},
  dsale:id=>{if(confirm('حذف هذه العملية من السجل؟')){H=H.filter(x=>x.id!=id);save();closeM();render()}},
  th:(_,b)=>{T.theme=b.dataset.v;save();theme();render()},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({P,H,T})],{type:'application/json'}));a.download='shop-backup-'+dk(Date.now())+'.json';a.click()},
  imp:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.P))throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;P=d.P;H=d.H||[];T={...T,...d.T};C=[];save();theme();render();toast('تم الاستيراد')}catch{toast('ملف غير صالح')}};r.readAsText(i.files[0])};i.click()},
  clh:()=>{if(confirm('حذف كل سجل المشتريات؟')){H=[];save();render();toast('تم حذف السجل')}},
  rst:()=>{if(confirm('سيتم حذف المنتجات والسجل نهائياً. متابعة؟')){P=[];C=[];H=[];save();render();toast('تم حذف كل البيانات')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset.id,b)});
document.addEventListener('change',e=>{const k=e.target.dataset?.k;if(!k)return;T[k]=e.target.type=='checkbox'?+e.target.checked:e.target.value.trim();save()});
theme();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
